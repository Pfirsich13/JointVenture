<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Duellhalle</title>
<meta name="theme-color" content="#ffcf24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duellhalle">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hub">
  <header class="top">
    <h1 class="logo"><i></i><span id="siteName">Duellhalle</span></h1>
    <div class="me-chip"><span>Ich:</span><b id="myName">Spieler</b><button id="editName" type="button">Ändern</button></div>
  </header>

  <section class="stage">
    <h2>Wer ist heute besser?</h2>
    <div class="mini" aria-hidden="true">
      <svg viewBox="0 0 300 345" preserveAspectRatio="xMidYMid meet">
        <rect x="8" y="8" width="284" height="329" rx="34" fill="#16130f"/>
        <rect x="20" y="20" width="260" height="305" rx="24" fill="#f4f6ff"/>
        <rect x="104" y="14" width="92" height="10" rx="4" fill="#16130f"/>
        <rect x="104" y="321" width="92" height="10" rx="4" fill="#16130f"/>
        <path d="M110 20a40 40 0 0 0 80 0" fill="none" stroke="#ff3a2a" stroke-width="4"/>
        <path d="M110 325a40 40 0 0 1 80 0" fill="none" stroke="#2453ff" stroke-width="4"/>
        <line x1="20" y1="172.5" x2="280" y2="172.5" stroke="#16130f" stroke-width="4" stroke-dasharray="12 9"/>
        <circle cx="150" cy="172.5" r="36" fill="none" stroke="#16130f" stroke-width="4"/>
        <g class="pad-t"><circle cx="150" cy="47" r="25" fill="#ff3a2a" stroke="#16130f" stroke-width="4"/><circle cx="150" cy="47" r="11" fill="#c41f12" stroke="#16130f" stroke-width="3"/></g>
        <g class="pad-b"><circle cx="150" cy="292" r="25" fill="#2453ff" stroke="#16130f" stroke-width="4"/><circle cx="150" cy="292" r="11" fill="#1435b8" stroke="#16130f" stroke-width="3"/></g>
        <g class="puck-run"><circle cx="150" cy="258" r="13" fill="#16130f"/><circle cx="150" cy="258" r="6" fill="none" stroke="#ffcf24" stroke-width="3"/></g>
      </svg>
    </div>
    <div class="left">
      <div class="score" id="score">
        <div class="side me"><small id="scMe">Du</small><strong id="scMeN">0</strong></div>
        <div class="vs">VS</div>
        <div class="side r op"><small id="scOp">Gegner</small><strong id="scOpN">0</strong></div>
      </div>
      <p class="score-note" id="scoreNote">Gewonnene Online-Duelle auf diesem Handy.</p>
      <button class="cta" id="quickPlay" type="button">Air-Hockey zocken</button>
    </div>
  </section>

  <nav class="filters" id="filters" aria-label="Spielrichtung"></nav>
  <main class="grid" id="grid"></main>
  <footer class="foot">Nur für uns zwei. Online-Spiele verbinden die Handys direkt miteinander.</footer>
</div>

<div id="game" hidden></div>

<script src="js/net.js"></script>
<script src="js/games/airhockey.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
